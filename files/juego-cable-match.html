<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cable Match</title>
<style>
  html,body{margin:0;background:#05060a;color:#eef3f7;font-family:'Consolas','Courier New',monospace;}
  .wrap{max-width:560px;margin:0 auto;padding:16px;text-align:center;}
  h1{font-size:18px;letter-spacing:2px;color:#00c8ff;margin:6px 0;}
  p.sub{color:#8a93a3;font-size:12.5px;margin:0 0 14px;}
  .hud{display:flex;justify-content:space-between;font-size:13px;margin:0 2px 12px;color:#8a93a3;}
  .hud b{color:#00ff88;}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
  .card{
    aspect-ratio:3/4; border-radius:10px; background:linear-gradient(160deg,#141a24,#0d1119);
    border:1px solid rgba(255,255,255,.1); display:flex; align-items:center; justify-content:center;
    font-size:12px; text-align:center; padding:6px; cursor:pointer; user-select:none; position:relative;
    transition:transform .15s ease, border-color .2s ease;
  }
  .card:hover{ transform:translateY(-2px); border-color:#00c8ff; }
  .card.flipped{ background:linear-gradient(160deg,#0d2a22,#0a1a15); border-color:#00ff88; color:#eef3f7; }
  .card.matched{ opacity:0.35; border-color:#00ff88; cursor:default; }
  .card .back{ font-size:26px; opacity:0.6; }
  .btn{background:linear-gradient(160deg,#00ff88,#00c46e);color:#04140b;border:none;border-radius:8px;padding:10px 18px;font-weight:700;cursor:pointer;margin-top:16px;font-family:inherit;}
  #win{display:none;color:#00ff88;font-weight:bold;margin-top:10px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>🔌 CABLE MATCH</h1>
  <p class="sub">Encuentra las parejas: cada pieza de hardware con su función real.</p>
  <div class="hud"><span>Intentos: <b id="tries">0</b></span><span>Parejas: <b id="pairs">0</b>/8</span></div>
  <div class="grid" id="grid"></div>
  <div id="win"></div>
  <button class="btn" id="restart">Reiniciar</button>
</div>
<script>
const PARES = [
  ['🧠 CPU', 'Piensa y calcula: es el cerebro de la PC'],
  ['📏 RAM', 'Mesa de trabajo: guarda lo que usas en el momento'],
  ['💾 SSD', 'Bodega rápida: guarda tus archivos aunque se apague'],
  ['🎮 GPU', 'El artista: dibuja todo lo que ves en pantalla'],
  ['🔋 PSU', 'El corazón: da electricidad a cada pieza'],
  ['🌀 Cooler', 'El aire acondicionado del CPU'],
  ['🧾 BIOS', 'El portero: revisa el hardware antes de arrancar'],
  ['🖥️ SO', 'El gerente: organiza todo una vez que enciende'],
];

let cartas=[], primera=null, segunda=null, bloqueado=false, intentos=0, parejas=0;

function baraja(arr){ return arr.sort(()=>Math.random()-0.5); }

function construir(){
  const items=[];
  PARES.forEach((p,i)=>{
    items.push({grupo:i, texto:p[0], tipo:'nombre'});
    items.push({grupo:i, texto:p[1], tipo:'desc'});
  });
  cartas = baraja(items).map((it,i)=>({...it, id:i, revelada:false, matched:false}));
  primera=null; segunda=null; bloqueado=false; intentos=0; parejas=0;
  document.getElementById('tries').textContent='0';
  document.getElementById('pairs').textContent='0';
  document.getElementById('win').style.display='none';
  render();
}

function render(){
  const grid=document.getElementById('grid');
  grid.innerHTML='';
  cartas.forEach(c=>{
    const div=document.createElement('div');
    div.className='card' + (c.revelada||c.matched ? ' flipped':'') + (c.matched?' matched':'');
    div.innerHTML = (c.revelada||c.matched) ? c.texto : '<span class="back">❓</span>';
    div.addEventListener('click', ()=> voltear(c.id));
    grid.appendChild(div);
  });
}

function voltear(id){
  if(bloqueado) return;
  const carta=cartas.find(c=>c.id===id);
  if(!carta || carta.revelada || carta.matched) return;
  carta.revelada=true;
  if(!primera){ primera=carta; render(); return; }
  segunda=carta; render();
  intentos++; document.getElementById('tries').textContent=intentos;
  bloqueado=true;
  setTimeout(()=>{
    if(primera.grupo===segunda.grupo && primera.tipo!==segunda.tipo){
      primera.matched=true; segunda.matched=true; parejas++;
      document.getElementById('pairs').textContent=parejas;
      if(parejas===PARES.length){
        document.getElementById('win').style.display='block';
        document.getElementById('win').textContent = `¡Completado en ${intentos} intentos!`;
      }
    } else {
      primera.revelada=false; segunda.revelada=false;
    }
    primera=null; segunda=null; bloqueado=false; render();
  }, 800);
}

document.getElementById('restart').addEventListener('click', construir);
construir();
</script>
</body>
</html>
