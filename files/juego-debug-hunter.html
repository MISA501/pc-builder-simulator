<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Debug Hunter</title>
<style>
  html,body{margin:0;background:#05060a;color:#eef3f7;font-family:'Consolas','Courier New',monospace;}
  .wrap{max-width:600px;margin:0 auto;padding:16px;}
  h1{font-size:18px;letter-spacing:2px;color:#ffb020;margin:6px 0;text-align:center;}
  p.sub{color:#8a93a3;font-size:12.5px;margin:0 0 14px;text-align:center;}
  .hud{display:flex;justify-content:space-between;font-size:13px;margin:0 2px 10px;color:#8a93a3;}
  .hud b{color:#00ff88;}
  .code{background:#0d1016;border:1px solid rgba(255,176,32,.3);border-radius:10px;padding:14px 10px;box-shadow:0 0 30px rgba(255,176,32,.1);min-height:340px;}
  .line{white-space:pre; font-size:14px; line-height:26px; cursor:default; padding:0 6px; border-radius:4px;}
  .line:hover{background:rgba(255,255,255,0.03);}
  .bug{ color:#ff2f6e; cursor:pointer; font-weight:bold; }
  .bug:hover{ text-shadow:0 0 8px #ff2f6e; }
  .found{ background:rgba(0,255,136,0.12) !important; }
  .btn{background:linear-gradient(160deg,#00ff88,#00c46e);color:#04140b;border:none;border-radius:8px;padding:10px 18px;font-weight:700;cursor:pointer;margin-top:14px;font-family:inherit;display:block;margin-left:auto;margin-right:auto;}
  #over{display:none;text-align:center;font-weight:bold;margin-top:10px;color:#00ff88;}
</style>
</head>
<body>
<div class="wrap">
  <h1>🐛 DEBUG HUNTER</h1>
  <p class="sub">Hay <b style="color:#ff2f6e">bugs</b> escondidos en este código. Haz click en cada error resaltado antes de que se acabe el tiempo.</p>
  <div class="hud"><span>Puntos: <b id="score">0</b></span><span>Tiempo: <b id="time">45</b>s</span><span>Bugs: <b id="found">0</b>/<span id="total">0</span></span></div>
  <div class="code" id="code"></div>
  <div id="over"></div>
  <button class="btn" id="restart">Reiniciar</button>
</div>
<script>
// líneas de "código" con errores intencionales marcados con [[BUG]]texto[[/BUG]]
const BLOQUES = [
[
 'function sumar(a, b) {',
 '  retrun a + b;'.replace('retrun','[[BUG]]retrun[[/BUG]]'),
 '}',
 '',
 'let total = sumar(3, 4)'.replace(')',')[[BUG]];;[[/BUG]]'),
 'console.log(total);',
 '',
 'if (total = 7) {'.replace('=','[[BUG]]=[[/BUG]]'),
 '  console.log("es 7");',
 '}',
 '',
 'for (let i = 0, i < 10, i++) {'.replace(', i < 10,','[[BUG]], i < 10,[[/BUG]]'),
 '  console.log(i);',
 '}',
],
[
 'def calcular_precio(cantidad, precio):',
 '    total = cantidad * precio'.replace('*','[[BUG]]/[[/BUG]]'),
 '    return total',
 '',
 'precio_final = calcular_precio(5, 10)',
 'print(f"Total: {precio_final}")',
 '',
 'lista = [1, 2, 3]',
 'print(lista[3])'.replace('[3]','[[[BUG]]3[[/BUG]]]'),
 '',
 'nombre = "Ana"',
 'edad = 15',
 'print("Hola " + nombre + edad)'.replace('+ edad','[[BUG]]+ edad[[/BUG]]'),
]
];

let lineasHTML=[], bugsTotal=0, bugsEncontrados=0, score=0, timeLeft=45, timer=null, gameOver=false;

function armarBloque(){
  const bloque = BLOQUES[Math.floor(Math.random()*BLOQUES.length)];
  lineasHTML=[]; bugsTotal=0;
  bloque.forEach(linea=>{
    let idx=0; let html='';
    while(true){
      const start=linea.indexOf('[[BUG]]', idx);
      if(start===-1){ html+=escapeHtml(linea.slice(idx)); break; }
      html+=escapeHtml(linea.slice(idx,start));
      const end=linea.indexOf('[[/BUG]]', start);
      const contenido=linea.slice(start+7,end);
      bugsTotal++;
      html+=`<span class="bug" data-bug="1">${escapeHtml(contenido)}</span>`;
      idx=end+8;
    }
    lineasHTML.push(html);
  });
}
function escapeHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function render(){
  const cont=document.getElementById('code');
  cont.innerHTML = lineasHTML.map(h=>`<div class="line">${h||'&nbsp;'}</div>`).join('');
  document.getElementById('total').textContent = bugsTotal;
  cont.querySelectorAll('.bug').forEach(el=>{
    el.addEventListener('click', ()=>{
      if(gameOver || el.classList.contains('found')) return;
      el.classList.add('found');
      bugsEncontrados++; score+=20;
      document.getElementById('score').textContent=score;
      document.getElementById('found').textContent=bugsEncontrados;
      if(bugsEncontrados>=bugsTotal){ finalizar(true); }
    });
  });
}
function reset(){
  armarBloque(); bugsEncontrados=0; score=0; timeLeft=45; gameOver=false;
  document.getElementById('score').textContent='0';
  document.getElementById('found').textContent='0';
  document.getElementById('time').textContent='45';
  document.getElementById('over').style.display='none';
  render();
  clearInterval(timer);
  timer=setInterval(()=>{
    timeLeft--; document.getElementById('time').textContent=timeLeft;
    if(timeLeft<=0) finalizar(false);
  },1000);
}
function finalizar(gano){
  gameOver=true; clearInterval(timer);
  const over=document.getElementById('over');
  over.style.display='block';
  over.style.color = gano ? '#00ff88' : '#ff2f6e';
  over.textContent = gano
    ? `¡Encontraste todos los bugs! Puntaje: ${score}`
    : `Se acabó el tiempo. Encontraste ${bugsEncontrados}/${bugsTotal} bugs — puntaje: ${score}`;
}
document.getElementById('restart').addEventListener('click', reset);
reset();
</script>
</body>
</html>
